# Словари входного контроля текста обращения (security.md, раздел 3.1).
#
# Хеш файла входит в rules_version набора артефактов (data-model.md,
# раздел 3): любое изменение словарей меняет версию.
#
# Словари неполны по природе: перефразированную инструкцию они пропустят.
# Поэтому шаблоны внедрения узкие — ложное отклонение обычного обращения
# хуже пропуска, который перехватят следующие рубежи: текст передаётся
# модели как данные, у модели нет полномочий, извлечённое проверяется по
# тексту и справочникам.

version: 1

# До смысловых проверок отсекается технически некорректный ввод.
max_length: 10000

# Попытки внедрения инструкций. Регулярные выражения, без учёта регистра.
injection:
  # Требование игнорировать или отменить прежние указания.
  - '(?:игнорир|проигнорир|забуд|не\s+учитыва)\w*\s+(?:\w+\s+){0,3}(?:инструкци|указани|правил|ограничени|промпт)'
  - '\b(?:ignore|disregard|forget|override)\s+(?:\w+\s+){0,3}(?:instructions?|prompts?|rules|guidelines)\b'
  # Попытка сменить роль модели.
  - '\b(?:ты|вы)\s+(?:теперь|отныне)\s+(?:\w+\s+){0,2}(?:ассистент|бот|модел|администратор|оператор)'
  - '(?:притворись|представь,?\s+что\s+ты|веди\s+себя\s+как)'
  - '\b(?:you\s+are\s+now|act\s+as|pretend\s+to\s+be|roleplay\s+as)\b'
  # Запрос раскрыть служебные указания. Узко: «покажите инструкцию по замене
  # картриджа» — обычная просьба.
  - '(?:покажи|выведи|раскрой|напечатай|перескажи)\w*\s+(?:мне\s+)?(?:(?:сво[иё]|тво[иё]|системн\w*|скрыт\w*|внутренн\w*|исходн\w*)\s+){1,2}(?:инструкци|промпт|указани)'
  - '\bsystem\s+prompt\b|системн\w*\s+(?:промпт|подсказк)'
  # Служебная разметка диалога.
  - '<\|?\s*(?:im_start|im_end|system|assistant|endoftext)\s*\|?>'
  - '^\s*(?:system|assistant|developer)\s*:'
  - '\[/?(?:INST|SYS)\]'
  - '\b(?:jailbreak|DAN\s+mode|developer\s+mode)\b'

# Предметная область. Обращение проходит, если найдено хотя бы одно слово
# (подстрока без учёта регистра) или шаблон. Список широкий намеренно:
# отказ по ошибке здесь дороже пропуска.
domain:
  words:
    - принтер
    - мфу
    - сканер
    - ноутбук
    - панел
    - сервер
    - картридж
    - тонер
    - печат
    - скан
    - бумаг
    - замят
    - замин
    - ошибк
    - код
    - экран
    - дисплей
    - монитор
    - включ
    - загруж
    - батаре
    - аккумулятор
    - заряд
    - клавиатур
    - сенсор
    - полос
    - серийн
    - модел
    - аппарат
    - устройств
    - оборудован
    - ремонт
    - гаранти
    - неисправ
    - не работает
    - сломал
    - завис
    - перезагруж
    - мигает
    - индикатор
    - лоток
    - печк
    - барабан
    - ролик
    - wi-fi
    - printer
    - scanner
    - laptop
    - error
  patterns:
    - '\b[A-Z]{1,6}\d{2,}[A-Za-z]*\b'          # обозначения моделей: M4103dw, P2040dn
    - '\b\d{2}\.[\dA-Za-z]{1,2}\b'              # коды вида 50.2, 13.xx
    - '#\d{3}\b'                                # коды вида #801
    - '\b[A-Z]{2,5}-[A-Z0-9]{2,}-\d{3,}\b'      # серийные номера

# Персональные данные: помечаются позициями, текст не меняется. В журналах
# помеченные фрагменты заменяются названием вида. ФИО — два-три слова с
# заглавной, последнее с основой отчества в любом падеже.
pii:
  телефон: '(?:\+7|\b8)[\s(-]*\d{3}[\s)-]*\d{3}[\s-]*\d{2}[\s-]*\d{2}\b'
  e-mail: '[\w.+-]+@[\w-]+(?:\.[\w-]+)+'
  ФИО: '\b(?:[А-ЯЁ][а-яё]+\s+){1,2}[А-ЯЁ][а-яё]+(?:ович|евич|ьич|ич|овн|евн|ичн)[а-яё]{0,3}\b'

notices:
  technical: Обращение не принято — текст пустой, слишком длинный или содержит недопустимые символы.
  injection: Обращение отклонено — текст содержит указания, адресованные системе. Опишите неисправность без таких указаний.
  out_of_domain: Платформа принимает обращения о неисправности оборудования. Этот запрос к ней не относится.
